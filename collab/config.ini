[nautilus]
context = nautilus
namespaces = osg-services
file = output/nautilus.jsonl
# Exclude some origins.
# TODO: We may want to exclude more, but I'm being conservative here until I know which ones host collab data.
# We exclude pnfs-redirector because we don't know how to deal with the 'xroot' backend.
exclude = hawaii-its-*
          kennesaw-osstore-*
          koastore-*
          ncar-*
          nsdf-climate*
          ospool-images*
          pnfs-redirector-*
          sdsc-s3-*
          sdsc-yaml-*

[tiger]
context = tiger
namespaces = osdf-prod
file = output/tiger.jsonl

[tempest]
context = tempest
namespaces = osgprod
file = output/tempest.jsonl

[tiger:collab-shared-osdf-pelican-origin]
storage_prefix_1 = /mnt/origin/public
federation_prefix_1 = /ospool/uw-shared/public
storage_prefix_2 = /mnt/origin/collaborations
federation_prefix_2 = /ospool/uw-shared/collaborations

[tempest:uc-public-osdf-pelican-origin]
storage_prefix_1 = /ospool/uc-shared/public
federation_prefix_1 = /ospool/uc-shared/public

[tempest:uc-project-osdf-pelican-origin]
storage_prefix_1 = /run/pelican/xrootd/origin/export/ospool/uc-shared/project
federation_prefix_1 = /ospool/uc-shared/project

[collabs]
# Map collaboration names to federation prefix patterns.
# Keys: collab name with '/', ' ', and '-' replaced by '_'
# Values: space-separated federation prefix strings; a prefix matches if
#         the export's federation_prefix starts with any listed value.
#
# Fill in real values here — see ainotes/plan.md for the collab list.
# Verify prefixes against actual federation_prefix values in the .jsonl files.
#
# Example (do not uncomment — replace with real values):
# Event_Horizon_Telescope = /EHT/public /EHT/private
# EIC_ePIC = /ePIC/public /ePIC/private
# REDTOP = /REDTOP/public /REDTOP/private
